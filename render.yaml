# One application server, one managed PostgreSQL database.
# Review Render's current pricing and plan availability before Blueprint sync.
services:
  - type: web
    name: voice-foundry
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: google
      - key: APP_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OWNER_SUB
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: voice-foundry-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: voice-foundry
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_MODE
        value: 'true'
      - key: ENABLE_BACKGROUND_WORKER
        value: 'true'
      - key: TWILIO_VALIDATE_SIGNATURES
        value: 'true'
      - key: VOICE_ENGINE
        value: openai_live
      - key: OPENAI_LIVE_MODEL
        value: gpt-live-1
      - key: OPENAI_LIVE_VOICE
        value: marin
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_IMPORT_ENABLED
        value: 'false'
      - key: MONTHLY_BUDGET_USD
        value: '15'
      - key: AGENT_MONTHLY_BUDGET_USD
        value: '5'
      - key: ENABLE_POSTCALL_PROCESSOR
        value: 'true'
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
databases:
  - name: voice-foundry-db
    databaseName: voice_foundry
    user: voice_foundry
    plan: basic-256mb
