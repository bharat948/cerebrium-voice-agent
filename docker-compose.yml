services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: voice_foundry
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-please-change}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_foundry"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  voice-foundry:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://voice:${POSTGRES_PASSWORD:-local-dev-please-change}@db:5432/voice_foundry
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
